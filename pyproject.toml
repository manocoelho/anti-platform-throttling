[project]
name = "anti-platform-throttling"
version = "1.0.0"
description = "POC 4 - Anti-Platform Throttling: distribuicao temporal de requisicoes com rate limiting distribuido, circuit breaker e bulkhead"
requires-python = ">=3.11"

dependencies = [
    # API e servidor
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Persistencia
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Estado distribuido (rate limiter, circuit breaker, feature flags)
    "redis>=5.2.0",
    # Mensageria
    "aio-pika>=9.5.0",
    # Cliente HTTP para envio as plataformas
    "httpx>=0.28.0",
    # Observabilidade
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# O script Lua do token bucket precisa ir junto com o pacote instalado.
[tool.setuptools.package-data]
apt = ["resilience/lua/*.lua"]

# ---------------------------------------------------------------------------
# Testes
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exige a infraestrutura no ar (postgres, redis, rabbitmq)",
    "load: teste de carga/resiliencia, exige o stack completo",
]
filterwarnings = ["error::DeprecationWarning:apt.*"]

# ---------------------------------------------------------------------------
# Lint / formatacao
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "B008",  # Depends() no default de argumento e o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
# Tipagem
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
